<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distraction Free Writer</title>
  <link rel="icon" href="ChatGPT Image May 6, 2026, 02_58_36 PM.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #000000;
      --bg-2: #000000;
      --glass: #0a0a0a;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #ffffff;
      --text: #f0f0f0;
      --muted: #888888;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.3);
      --danger-bg: rgba(239, 68, 68, 0.05);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --success-bg: rgba(16, 185, 129, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .grid-overlay::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.6), transparent 70%);
    }

    .shell {
      position: relative;
      width: min(1200px, 92vw);
      height: min(750px, 88vh);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      transition: stroke 0.2s ease;
    }

    .btn.status-dirty {
      border-color: rgba(239, 68, 68, 0.4);
      background: var(--danger-bg);
      box-shadow: 0 0 12px var(--danger-glow);
    }
    
    .btn.status-dirty svg {
      stroke: var(--danger);
      opacity: 1;
    }

    .btn.status-success {
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--success-bg);
      box-shadow: 0 0 12px var(--success-glow);
    }

    .btn.status-success svg {
      stroke: var(--success);
      opacity: 1;
    }
    
    .btn-icon {
      padding: 8px;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .btn-icon:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }
    .btn-icon:hover svg {
      stroke: var(--danger);
      opacity: 1;
    }

    .editor {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      font-family: 'IBM Plex Mono', 'Space Grotesk', system-ui, -apple-system, monospace;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text);
      outline: none;
      border: none;
      background: transparent;
      caret-color: var(--accent);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      resize: none;
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .editor::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .editor::-webkit-scrollbar {
      width: 10px;
    }

    .editor::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }

    .editor:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.1);
      outline-offset: -1px;
    }

    @media (max-width: 720px) {
      .shell { height: min(700px, 92vh); border-radius: 12px; }
      .toolbar { padding: 12px 14px; }
      .btn { padding: 8px 12px; }
      .editor { padding: 24px; font-size: 1rem; }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: min(400px, 90vw);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      transform: translateY(10px) scale(0.98);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal h3 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    .modal p {
      margin: 0 0 24px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-danger {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body class="grid-overlay">
  <div class="shell">
    <div class="toolbar">
      <button class="btn" id="copyBtn" type="button" aria-label="Copy all text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        Copy
      </button>
      <button class="btn" id="loadBtn" type="button" aria-label="Open text file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" />
          <path d="m7 11 5 5 5-5" />
          <path d="M4 20h16" />
        </svg>
        Open
      </button>
      <button class="btn" id="saveBtn" type="button" aria-label="Save text file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h10l4 4v12H5z" />
          <path d="M9 4v6h6" />
        </svg>
        Save
      </button>
      <button class="btn" id="clearBtn" type="button" aria-label="Clear all text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" x2="10" y1="11" y2="17" />
          <line x1="14" x2="14" y1="11" y2="17" />
        </svg>
        Clear
      </button>
      <div class="divider"></div>
      <button class="btn btn-icon" id="closeBtn" type="button" aria-label="Close tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
      <input id="fileInput" type="file" accept="text/plain,.txt,.md" hidden />
    </div>
    <textarea
      id="editor"
      class="editor"
      spellcheck="false"
      aria-label="Distraction free editor"
      placeholder="Start typing here..."
    ></textarea>
  </div>

  <div id="closeModal" class="modal-overlay">
    <div class="modal">
      <h3>Unsaved Changes</h3>
      <p>You haven't copied or saved your latest edits. Are you sure you want to discard them?</p>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-danger" id="modalExit">Exit Anyway</button>
      </div>
    </div>
  </div>

  <div id="clearModal" class="modal-overlay">
    <div class="modal">
      <h3>Clear Notepad</h3>
      <p>Are you sure you want to clear all text? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn" id="modalClearCancel">Cancel</button>
        <button class="btn btn-danger" id="modalClearConfirm">Clear</button>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const loadBtn = document.getElementById('loadBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const closeBtn = document.getElementById('closeBtn');
    const fileInput = document.getElementById('fileInput');

    // --- Bullet Points Subsystem ---
    const BULLETS = ['•', '◦', '▪', '▫', '·'];
    let backtickPressTimer = null;
    let backtickIsLongPress = false;
    const LONG_PRESS_MS = 350;

    function getCurrentLine() {
      const val = editor.value;
      const pos = editor.selectionStart;
      let startPos = val.lastIndexOf('\n', pos - 1);
      startPos = startPos === -1 ? 0 : startPos + 1;
      let endPos = val.indexOf('\n', pos);
      endPos = endPos === -1 ? val.length : endPos;
      return {
        text: val.substring(startPos, endPos),
        startPos,
        endPos,
        cursorOffset: pos - startPos
      };
    }

    function getBulletLevel(lineText) {
      const match = lineText.match(/^(\s*)([•◦▪▫·])\s/);
      if (!match) return 0;
      const spaces = match[1].length;
      return Math.floor(spaces / 2) + 1;
    }

    function getBulletString(level) {
      const indent = '  '.repeat(level - 1);
      const bullet = BULLETS[Math.min(level - 1, BULLETS.length - 1)];
      return `${indent}${bullet} `;
    }

    function replaceRange(start, end, newText, preserveCursor = false) {
      const val = editor.value;
      const oldCursor = editor.selectionStart;
      const oldTextLength = end - start;
      editor.value = val.substring(0, start) + newText + val.substring(end);
      if (preserveCursor) {
        const diff = newText.length - oldTextLength;
        const newCursor = Math.max(start, Math.min(start + newText.length, oldCursor + diff));
        editor.selectionStart = editor.selectionEnd = newCursor;
      } else {
        editor.selectionStart = editor.selectionEnd = start + newText.length;
      }
      setDirty();
    }

    function insertTextAtCursor(text) {
      const start = editor.selectionStart;
      const val = editor.value;
      editor.value = val.substring(0, start) + text + val.substring(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = start + text.length;
      setDirty();
    }

    function startBullet() {
      const { text, startPos, endPos } = getCurrentLine();
      if (text.trim() === '') {
        replaceRange(startPos, endPos, getBulletString(1));
      } else {
        insertTextAtCursor('\n' + getBulletString(1));
      }
    }

    function insertNextBullet(level, nest = false) {
      const { text, startPos, endPos } = getCurrentLine();
      const currentLevelStr = getBulletString(level);
      const nextLevelStr = getBulletString(nest ? level + 1 : level);
      if (text === currentLevelStr) {
        if (nest) replaceRange(startPos, endPos, nextLevelStr);
        else insertTextAtCursor('\n' + nextLevelStr);
      } else {
        insertTextAtCursor('\n' + nextLevelStr);
      }
    }

    function decreaseBulletLevel(level) {
      const { text, startPos, endPos } = getCurrentLine();
      const match = text.match(/^(\s*)([•◦▪▫·])\s(.*)/);
      if (!match) return; 
      if (level === 1) {
        replaceRange(startPos, endPos, match[3], true);
      } else {
        const newBulletString = getBulletString(level - 1);
        replaceRange(startPos, endPos, newBulletString + match[3], true);
      }
    }

    editor.addEventListener('keydown', (e) => {
      // Resolve short press immediately if typing another key concurrently
      if (backtickPressTimer && e.key !== '`') {
        clearTimeout(backtickPressTimer);
        backtickPressTimer = null;
        if (!backtickIsLongPress) {
          const level = getBulletLevel(getCurrentLine().text);
          if (level === 0) insertTextAtCursor('`');
          else insertNextBullet(level, false);
        }
      }

      if (e.key === '`' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (editor.selectionStart !== editor.selectionEnd) return; 
        
        e.preventDefault(); 
        if (e.repeat) return;
        
        if (!backtickPressTimer) {
          backtickIsLongPress = false;
          backtickPressTimer = setTimeout(() => {
            backtickIsLongPress = true;
            backtickPressTimer = null;
            
            const level = getBulletLevel(getCurrentLine().text);
            if (level === 0) startBullet();
            else insertNextBullet(level, true);
          }, LONG_PRESS_MS);
        }
      } else if (e.key === 'Escape') {
        const level = getBulletLevel(getCurrentLine().text);
        if (level > 0) {
          e.preventDefault();
          decreaseBulletLevel(level);
        }
      }
    });

    editor.addEventListener('keyup', (e) => {
      if (e.key === '`') {
        if (backtickPressTimer) {
          clearTimeout(backtickPressTimer);
          backtickPressTimer = null;
          
          if (!backtickIsLongPress) {
            const level = getBulletLevel(getCurrentLine().text);
            if (level === 0) insertTextAtCursor('`');
            else insertNextBullet(level, false);
          }
        }
        backtickIsLongPress = false;
      }
    });

    // --- State and Interaction Logic ---

    function setDirty() {
      if (editor.value.length > 0) {
        copyBtn.classList.remove('status-success');
        saveBtn.classList.remove('status-success');
        copyBtn.classList.add('status-dirty');
        saveBtn.classList.add('status-dirty');
      } else {
        copyBtn.classList.remove('status-success', 'status-dirty');
        saveBtn.classList.remove('status-success', 'status-dirty');
      }
    }

    function setCopied() {
      copyBtn.classList.remove('status-dirty');
      copyBtn.classList.add('status-success');
    }

    function setSaved() {
      saveBtn.classList.remove('status-dirty');
      saveBtn.classList.add('status-success');
    }

    editor.addEventListener('input', setDirty);

    // Trigger native file picker for loading content
    loadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (event) => {
      const [file] = event.target.files || [];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        editor.value = e.target?.result || '';
        setDirty();
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    // Save current text content as a plain .txt file
    saveBtn.addEventListener('click', () => {
      if (editor.value.length === 0) return;
      const blob = new Blob([editor.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'notes.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setSaved();
    });

    // Copy all text to clipboard
    copyBtn.addEventListener('click', async () => {
      if (editor.value.length === 0) return;
      try {
        await navigator.clipboard.writeText(editor.value);
        setCopied();
      } catch (err) {
        console.error('Failed to copy:', err);
      }
    });

    // Clear text handler
    clearBtn.addEventListener('click', () => {
      if (editor.value.length === 0) return;
      document.getElementById('clearModal').classList.add('active');
    });

    document.getElementById('modalClearCancel').addEventListener('click', () => {
      document.getElementById('clearModal').classList.remove('active');
    });

    document.getElementById('modalClearConfirm').addEventListener('click', () => {
      editor.value = '';
      setDirty();
      document.getElementById('clearModal').classList.remove('active');
      editor.focus();
    });

    // Close tab handler
    function closeTab() {
      // Workaround to bypass browser security restrictions for closing tabs
      window.open('about:blank', '_self').close();
      window.close();
      
      // Fallback display if closing the window fails due to strict browser security
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:sans-serif;gap:16px;">
            <div style="font-size:1.2rem;">Browser security prevents automatic closing.</div>
            <div style="color:#888;font-size:0.95rem;">Please press <strong style="color:#fff;">Ctrl + W</strong> or <strong style="color:#fff;">Cmd + W</strong> to close this tab.</div>
          </div>
        `;
      }, 200);
    }

    closeBtn.addEventListener('click', () => {
      const hasText = editor.value.trim() !== '';
      const bothDirty = saveBtn.classList.contains('status-dirty') && copyBtn.classList.contains('status-dirty');

      if (hasText && bothDirty) {
        document.getElementById('closeModal').classList.add('active');
      } else {
        closeTab();
      }
    });

    document.getElementById('modalCancel').addEventListener('click', () => {
      document.getElementById('closeModal').classList.remove('active');
    });

    document.getElementById('modalExit').addEventListener('click', () => {
      document.getElementById('closeModal').classList.remove('active');
      closeTab();
    });

    // Handle browser native close event
    window.addEventListener('beforeunload', (e) => {
      const hasText = editor.value.trim() !== '';
      const bothDirty = saveBtn.classList.contains('status-dirty') && copyBtn.classList.contains('status-dirty');
      if (hasText && bothDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // Initialize state
    setTimeout(setDirty, 100);
  </script>
</body>
</html>
